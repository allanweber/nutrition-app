<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Vitalis Emerald | Compact Upload Variation</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&amp;family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#19985E",
                        "background": "#FBFBFB",
                        "on-surface": "#191d17",
                        "on-surface-variant": "#41493e",
                        "outline-variant": "#c0c9ba",
                    },
                    fontFamily: {
                        "headline": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1.5rem", "full": "9999px" },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .font-manrope { font-family: 'Manrope', sans-serif; }
        .font-inter { font-family: 'Inter', sans-serif; }
        :root {
            --primary-brand: #19985E;
            --bg-main: #FBFBFB;
            --delete-icon-color: #717a6d;
        }
    </style>
</head>
<body class="bg-[var(--bg-main)] font-body text-on-surface min-h-screen flex items-center justify-center p-4">
<main class="w-full max-w-4xl mx-auto">
<div class="bg-white rounded-2xl p-4 md:p-6 border border-outline-variant/30 shadow-sm overflow-hidden flex flex-col md:flex-row-reverse gap-6">
<div class="flex-1 relative z-10 flex flex-col items-center justify-center text-center p-6 border-2 border-dashed border-outline-variant/60 rounded-2xl bg-[#FBFBFB]/50 hover:bg-[#FBFBFB] transition-all duration-300">
<div class="w-12 h-12 bg-[#19985E]/10 rounded-full flex items-center justify-center mb-3">
<span class="material-symbols-outlined text-[var(--primary-brand)] !text-2xl" data-icon="cloud_upload">cloud_upload</span>
</div>
<div class="mb-4">
<h2 class="text-lg font-bold font-headline text-on-surface">Drag &amp; drop files here</h2>
<p class="text-on-surface-variant text-xs max-w-[240px] mx-auto mt-1">Upload images of your meals, ingredient lists, or clinical results.</p>
</div>
<div class="flex flex-col items-center gap-3 w-full">
<div class="flex items-center gap-3 w-full justify-center">
<button class="bg-[var(--primary-brand)] text-white px-5 py-2.5 rounded-xl font-bold font-headline text-sm hover:brightness-110 active:scale-95 transition-all duration-200 shadow-md shadow-[#19985E]/20">
                            Browse Files
                        </button>
<div class="flex items-center gap-2">
<span class="text-on-surface-variant font-label text-[10px] uppercase tracking-wider">or</span>
<div class="flex items-center gap-1.5 bg-white px-2 py-1.5 rounded-lg border border-outline-variant/40 shadow-sm">
<span class="text-[10px] text-on-surface-variant font-medium">Paste</span>
<div class="flex items-center gap-0.5">
<kbd class="font-sans bg-gray-100 px-1 py-0.5 rounded text-[8px] border border-outline-variant/30 text-on-surface">Ctrl</kbd>
<span class="text-[8px] text-on-surface-variant">+</span>
<kbd class="font-sans bg-gray-100 px-1 py-0.5 rounded text-[8px] border border-outline-variant/30 text-on-surface">V</kbd>
</div>
</div>
</div>
</div>
<p class="text-[10px] text-on-surface-variant/60 font-medium">Supports JPG, PNG, PDF up to 10MB</p>
</div>
</div>
<div class="flex-1 relative rounded-2xl overflow-hidden group border border-outline-variant/20 h-auto min-h-[250px] md:min-h-0">
<img alt="Uploaded meal" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBjS5RN4PZNfCriiv_42u9WZ0qEn0V0OunpIJugzIBYcpv7uRND8SVTr7C5Eup6tVbYEXWj0uFUdM5yWOK8X2jnZIyEwfVhih3XWPgEkWFAxd_2H3yP_HzxfHJlfAIbEABdPGdBUmkJLFGZ8Q_9NzlJpJSz21tiH97TQDY7b-hloYzjyfvjSvmdBhviQa1JebDFliaZXo0xWgPcAlMku4EB2HlXC73ODSvKRy2FtZwseJRQ9g87kpQLrcHKMqA-rLPKVJD8y9zNcNJ8"/>
<div class="absolute inset-0 bg-black/5 group-hover:bg-transparent transition-colors duration-300"></div>
<button aria-label="Delete image" class="absolute bottom-4 right-4 w-10 h-10 bg-white/90 hover:bg-white rounded-lg shadow-lg flex items-center justify-center transition-all duration-200 hover:scale-105 active:scale-90 border border-outline-variant/20">
<span class="material-symbols-outlined !text-2xl text-[#717a6d]">delete</span>
</button>
<div class="absolute top-4 right-4 bg-white/90 px-2 py-1 rounded-md text-[10px] font-bold text-[var(--primary-brand)] shadow-sm uppercase tracking-tight">
                    Uploaded
                </div>
</div>
</div>
</main>

</body></html>
