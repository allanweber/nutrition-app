<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-secondary-container": "#516b4c",
                        "outline": "#717a6d",
                        "secondary-fixed-dim": "#b1cfa9",
                        "primary-fixed-dim": "#92d78a",
                        "on-surface": "#191d17",
                        "on-error-container": "#93000a",
                        "on-primary": "#ffffff",
                        "primary": "#00490d",
                        "background": "#f7fbf1",
                        "surface-container": "#ecefe6",
                        "tertiary-container": "#8d3858",
                        "secondary": "#4b6547",
                        "outline-variant": "#c0c9ba",
                        "on-tertiary-fixed": "#3e001d",
                        "on-secondary-fixed": "#082009",
                        "surface-container-high": "#e6e9e0",
                        "inverse-on-surface": "#eff2e9",
                        "on-background": "#191d17",
                        "on-surface-variant": "#41493e",
                        "on-primary-container": "#96dc8e",
                        "inverse-surface": "#2d322c",
                        "on-primary-fixed-variant": "#0c5215",
                        "tertiary": "#702141",
                        "surface-container-lowest": "#ffffff",
                        "surface-dim": "#d8dbd2",
                        "secondary-fixed": "#cdebc4",
                        "surface-variant": "#e0e4db",
                        "inverse-primary": "#92d78a",
                        "error-container": "#ffdad6",
                        "tertiary-fixed-dim": "#ffb1c8",
                        "error": "#ba1a1a",
                        "on-tertiary-container": "#ffb7cc",
                        "on-secondary-fixed-variant": "#344d31",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed": "#ffd9e2",
                        "surface": "#f7fbf1",
                        "primary-fixed": "#adf4a4",
                        "surface-tint": "#2a6b2b",
                        "primary-container": "#206223",
                        "secondary-container": "#cdebc4",
                        "on-error": "#ffffff",
                        "surface-container-low": "#f2f5ec"
                    },
                    fontFamily: {
                        "headline": ["Manrope", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #c0c9ba;
            border-radius: 10px;
        }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
</head>
<body class="bg-background font-body text-on-background">
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/30 backdrop-blur-sm">
<div class="relative w-full max-w-[340px] bg-surface-container-lowest rounded-2xl shadow-2xl flex flex-col border border-outline-variant overflow-hidden max-h-[921px]">
<button class="absolute top-2 right-2 z-[60] size-7 flex items-center justify-center rounded-full bg-white/90 hover:bg-white shadow-sm transition-colors border border-outline-variant">
<span class="material-symbols-outlined text-on-surface text-lg">close</span>
</button>
<div class="relative h-24 overflow-hidden shrink-0">
<img alt="Grilled Salmon Bowl" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDqXO8V6lz_Dfx3sqgH61k2xsvp2wUbhLtElhenBmgSv_I9NaenAe8cTRqxgE30q6UqVibIBAzwYgpF1mwP8kCZNuELXXzmqUkrATA7GBawelUza6Tc5HqTXuOMFYP5CgasVCZe2iNOTXHoLwwnfNg9RZMUyjwlX_HNfTuSXQqyAx8y2y76Eecte7mh9RxFoMq4Mfb6X_Mx-QimCecUQlojUgaaDBY4nCEbBv3H-WpCck6_He0_wE8QMGBqQVlf_YOvbf2n_tGMj2Yf"/>
<div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/10 to-transparent flex flex-col justify-end p-3">
<span class="text-[9px] font-bold uppercase tracking-[0.1em] text-primary-fixed">Vitalis Kitchen • High Protein</span>
<h1 class="font-headline text-lg font-extrabold text-white leading-tight">Grilled Salmon Bowl</h1>
</div>
</div>
<div class="flex-1 overflow-y-auto p-4 space-y-4">
<section class="space-y-3">
<h2 class="text-[11px] font-bold uppercase tracking-[0.2em] text-secondary flex items-center gap-1.5">
<span class="material-symbols-outlined text-sm">edit_note</span>
                        Quick Log
                    </h2>
<div class="flex flex-col gap-2.5">
<div class="group">
<label class="text-[10px] font-bold text-on-surface-variant uppercase mb-1 block ml-1">Meal Type</label>
<div class="relative">
<select class="w-full appearance-none rounded-lg border border-outline-variant bg-surface-container-low pl-3 pr-8 py-2 text-xs font-semibold focus:border-primary-container focus:ring-1 focus:ring-primary-container">
<option value="lunch">Lunch</option>
<option value="breakfast">Breakfast</option>
<option value="dinner">Dinner</option>
<option value="snack">Snack</option>
</select>
<span class="material-symbols-outlined absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none text-secondary text-base">expand_more</span>
</div>
</div>
<div class="group">
<label class="text-[10px] font-bold text-on-surface-variant uppercase mb-1 block ml-1">Date</label>
<div class="flex items-center justify-between p-1.5 rounded-lg border border-outline-variant bg-white">
<button class="size-6 flex items-center justify-center text-on-surface hover:bg-surface rounded transition-colors">
<span class="material-symbols-outlined text-lg">chevron_left</span>
</button>
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-primary text-xs">calendar_today</span>
<span class="font-bold text-xs text-on-surface">Oct 27</span>
</div>
<button class="size-6 flex items-center justify-center text-on-surface hover:bg-surface rounded transition-colors">
<span class="material-symbols-outlined text-lg">chevron_right</span>
</button>
</div>
</div>
<div class="group">
<label class="text-[10px] font-bold text-on-surface-variant uppercase mb-1 block ml-1">Quantity &amp; Serving Size</label>
<div class="flex items-center rounded-lg border border-outline-variant bg-surface-container-low overflow-hidden focus-within:ring-1 focus-within:ring-primary-container focus-within:border-primary-container">
<input class="flex-1 bg-transparent border-none px-3 py-2 text-xs font-extrabold text-on-surface focus:ring-0" type="number" value="100"/>
<div class="h-5 w-px bg-outline-variant"></div>
<div class="relative min-w-[70px]">
<select class="w-full appearance-none bg-transparent border-none pl-2 pr-7 py-2 text-xs font-bold text-secondary focus:ring-0">
<option value="g">g</option>
<option value="cup">Cup</option>
<option value="oz">Oz</option>
<option value="serving">Srv</option>
</select>
<span class="material-symbols-outlined absolute right-1.5 top-1/2 -translate-y-1/2 pointer-events-none text-secondary text-base">expand_more</span>
</div>
</div>
</div>
<div class="px-1 pt-1">
<input class="w-full h-1 bg-surface-container rounded-lg appearance-none cursor-pointer accent-primary-container" max="500" min="50" step="10" type="range" value="100"/>
<div class="flex justify-between mt-1">
<span class="text-[8px] font-bold text-outline uppercase">Min</span>
<span class="text-[8px] font-bold text-outline uppercase">Max</span>
</div>
</div>
</div>
</section>
<section class="space-y-2 pt-1 border-t border-outline-variant/30">
<h3 class="text-[9px] font-bold uppercase tracking-widest text-secondary text-center">Macros for current amount</h3>
<div class="space-y-2">
<div class="text-center p-3 bg-surface-container-low rounded-lg border border-outline-variant/20">
<p class="text-[8px] font-bold uppercase text-secondary/70 mb-0.5">Calories</p>
<p class="text-xl font-headline font-extrabold text-primary">480 kcal</p>
</div>
<div class="grid grid-cols-3 gap-2">
<div class="text-center p-2 bg-surface-container-low rounded-lg border border-outline-variant/20">
<p class="text-[8px] font-bold uppercase text-secondary/70">Protein</p>
<p class="text-sm font-headline font-extrabold text-primary">32g</p>
</div>
<div class="text-center p-2 bg-surface-container-low rounded-lg border border-outline-variant/20">
<p class="text-[8px] font-bold uppercase text-secondary/70">Carbs</p>
<p class="text-sm font-headline font-extrabold text-on-surface">45g</p>
</div>
<div class="text-center p-2 bg-surface-container-low rounded-lg border border-outline-variant/20">
<p class="text-[8px] font-bold uppercase text-secondary/70">Fats</p>
<p class="text-sm font-headline font-extrabold text-tertiary">18g</p>
</div>
</div>
</div>
</section>
</div>
<div class="p-3 bg-surface-container-high border-t border-outline-variant flex gap-2">
<button class="px-4 py-2.5 rounded-lg border border-outline-variant bg-white font-bold text-[11px] text-on-surface-variant hover:bg-surface transition-colors">
                    Cancel
                </button>
<button class="flex-1 py-2.5 rounded-lg bg-primary text-white font-extrabold text-[11px] shadow-lg shadow-primary/20 hover:brightness-110 active:scale-95 transition-all flex items-center justify-center gap-1.5">
<span class="material-symbols-outlined text-base" style="font-variation-settings: 'FILL' 1;">add_circle</span>
                    Log Meal
                </button>
</div>
</div>
</div>
<div class="min-h-screen p-8 opacity-10 pointer-events-none select-none">
<div class="max-w-[960px] mx-auto">
<header class="mb-12">
<h1 class="text-4xl font-headline font-extrabold">Meal Planner</h1>
<p class="text-secondary">Weekly Overview</p>
</header>
<div class="grid grid-cols-7 gap-4">
<div class="h-32 bg-surface-container rounded-2xl"></div>
<div class="h-32 bg-surface-container rounded-2xl"></div>
<div class="h-32 bg-surface-container rounded-2xl"></div>
<div class="h-32 bg-primary-container/10 border-2 border-primary rounded-2xl"></div>
<div class="h-32 bg-surface-container rounded-2xl"></div>
<div class="h-32 bg-surface-container rounded-2xl"></div>
<div class="h-32 bg-surface-container rounded-2xl"></div>
</div>
</div>
</div>

</body></html>
