<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Vitalis Emerald | Compact Upload</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&amp;family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#19985E",
              "background": "#FBFBFB",
              "on-surface": "#191d17",
              "on-surface-variant": "#41493e",
              "outline-variant": "#c0c9ba",
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1.5rem", "full": "9999px"},
          },
        },
      }
    </script>
<style type="text/tailwindcss">
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .font-manrope { font-family: 'Manrope', sans-serif; }
      .font-inter { font-family: 'Inter', sans-serif; }
      :root {
        --primary-brand: #19985E;
        --bg-main: #FBFBFB;
      }
    </style>
</head>
<body class="bg-[var(--bg-main)] font-body text-on-surface min-h-screen flex items-center justify-center p-4">
<main class="w-full max-w-3xl mx-auto">
<div class="bg-white rounded-2xl p-4 md:p-6 border border-outline-variant/30 shadow-sm relative overflow-hidden">
<div class="relative z-10 flex flex-col items-center justify-center text-center p-6 md:p-10 border-2 border-dashed border-outline-variant/60 rounded-2xl bg-[#FBFBFB]/50 hover:bg-[#FBFBFB] transition-all duration-300">
<div class="w-16 h-16 bg-[#19985E]/10 rounded-full flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-[var(--primary-brand)] !text-4xl" data-icon="cloud_upload">cloud_upload</span>
</div>
<div class="mb-6">
<h2 class="text-xl font-bold font-headline text-on-surface">Drag &amp; drop files here</h2>
<p class="text-on-surface-variant text-sm max-w-sm mx-auto mt-1">Upload images of your meals, ingredient lists, or clinical results for AI processing.</p>
</div>
<div class="flex flex-col items-center gap-4 w-full">
<div class="flex flex-col md:flex-row items-center gap-4 w-full justify-center">
<button class="bg-[var(--primary-brand)] text-white px-8 py-3 rounded-xl font-bold font-headline text-base hover:brightness-110 active:scale-95 transition-all duration-200 shadow-md shadow-[#19985E]/20">
                            Browse Files
                        </button>
<div class="flex items-center gap-3">
<span class="text-on-surface-variant font-label text-xs uppercase tracking-wider">or</span>
<div class="flex items-center gap-1.5 bg-white px-3 py-1.5 rounded-lg border border-outline-variant/40 shadow-sm">
<span class="text-xs text-on-surface-variant font-medium">Paste</span>
<div class="flex items-center gap-0.5">
<kbd class="font-sans bg-gray-100 px-1.5 py-0.5 rounded text-[10px] border border-outline-variant/30 text-on-surface">Ctrl</kbd>
<span class="text-[10px] text-on-surface-variant">+</span>
<kbd class="font-sans bg-gray-100 px-1.5 py-0.5 rounded text-[10px] border border-outline-variant/30 text-on-surface">V</kbd>
</div>
</div>
</div>
</div>
<p class="text-xs text-on-surface-variant/60 font-medium">Supports JPG, PNG, PDF up to 10MB</p>
</div>
</div>
</div>
</main>

</body></html>
