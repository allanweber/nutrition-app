name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run test:unit:run

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: unit-tests

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nutrition_app_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/nutrition_app_test
          DRIZZLE_STRICT: 'false'
          DRIZZLE_VERBOSE: 'false'
        run: npx drizzle-kit push --force

      - name: Start dev server and seed database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/nutrition_app_test
          BETTER_AUTH_SECRET: test-secret-for-ci
          BETTER_AUTH_URL: http://localhost:3014
          GOOGLE_CLIENT_ID: test_client_id
          GOOGLE_CLIENT_SECRET: test_client_secret
          USE_MOCK_FATSECRET: 'true'
          FATSECRET_CONSUMER_KEY: test_consumer_key
          FATSECRET_CONSUMER_SECRET: test_consumer_secret
          NODE_ENV: test
          PORT: '3014'
          SEED_PRO_USERS: 'false'
        run: |
          npx dotenv -e .env.test -o -- npm run dev -- --port 3014 &
          DEV_PID=$!

          echo "Waiting for dev server to start on port 3014..."
          for i in {1..60}; do
            if curl -sf http://localhost:3014/login > /dev/null 2>&1; then
              echo "Server is ready!"
              break
            fi
            sleep 2
          done

          echo "Seeding database..."
          npx dotenv -e .env.test -o -- npx tsx src/server/db/seed.ts

      - name: Run E2E tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/nutrition_app_test
          BETTER_AUTH_SECRET: test-secret-for-ci
          BETTER_AUTH_URL: http://localhost:3014
          GOOGLE_CLIENT_ID: test_client_id
          GOOGLE_CLIENT_SECRET: test_client_secret
          USE_MOCK_FATSECRET: 'true'
          FATSECRET_CONSUMER_KEY: test_consumer_key
          FATSECRET_CONSUMER_SECRET: test_consumer_secret
          NODE_ENV: test
          PORT: '3014'
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:3014
          PLAYWRIGHT_MANAGED_SERVER: '1'
          CI: true
        run: npx dotenv -e .env.test -o -- npx playwright test --project=chromium

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-screenshots
          path: test-results/
          retention-days: 7
