openapi: 3.0.3
info:
  title: Nutrition App Baseline Product API
  version: 0.1.0-baseline
  description: |
    Baseline contract snapshot for parity verification against current implementation.
    Focused on baseline food logging, analytics, goals, auth access, and limited diet-plan operations.
servers:
  - url: http://localhost:3000
paths:
  /api/foods/search:
    get:
      summary: Search foods from configured provider/cache
      parameters:
        - in: query
          name: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Search results
        '400':
          description: Invalid query
        '401':
          description: Unauthorized

  /api/foods/nutrients:
    post:
      summary: Resolve nutrients for selected food/serving
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Nutrient payload
        '400':
          description: Validation error
        '401':
          description: Unauthorized

  /api/foods/upc:
    get:
      summary: Lookup food by UPC code
      parameters:
        - in: query
          name: upc
          required: true
          schema:
            type: string
      responses:
        '200':
          description: UPC lookup result
        '400':
          description: Invalid UPC input
        '401':
          description: Unauthorized

  /api/food-logs:
    get:
      summary: List food logs and totals for a date
      parameters:
        - in: query
          name: date
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Daily grouped logs and totals
        '400':
          description: Invalid date
        '401':
          description: Unauthorized
    post:
      summary: Create food log entry from food snapshot and quantity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [foodName, quantity, servingUnit, mealType]
              properties:
                foodName:
                  type: string
                quantity:
                  oneOf:
                    - type: string
                    - type: number
                servingUnit:
                  type: string
                mealType:
                  type: string
                  enum: [breakfast, lunch, dinner, snack]
      responses:
        '201':
          description: Food log created
        '400':
          description: Validation error
        '401':
          description: Unauthorized

  /api/food-logs/{id}:
    delete:
      summary: Delete a food log entry
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Entry deleted
        '400':
          description: Invalid ID
        '401':
          description: Unauthorized
        '404':
          description: Entry not found

  /api/analytics/daily:
    get:
      summary: Retrieve daily nutrition summary and logs
      parameters:
        - in: query
          name: date
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Daily analytics payload
        '400':
          description: Invalid date
        '401':
          description: Unauthorized

  /api/analytics/weekly:
    get:
      summary: Retrieve weekly trend analytics
      parameters:
        - in: query
          name: days
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 365
      responses:
        '200':
          description: Weekly analytics payload
        '400':
          description: Invalid days parameter
        '401':
          description: Unauthorized

  /api/goals:
    get:
      summary: Retrieve active goals or defaults
      responses:
        '200':
          description: Goal payload
        '401':
          description: Unauthorized
    put:
      summary: Update nutrition goals
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [goals]
              properties:
                goals:
                  type: object
      responses:
        '200':
          description: Goals updated
        '400':
          description: Validation error
        '401':
          description: Unauthorized

  /api/diet-plans/{dietPlanId}/meal-groups:
    get:
      summary: List meal groups for an existing diet plan (partial baseline coverage)
      parameters:
        - in: path
          name: dietPlanId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Meal group payload
        '401':
          description: Unauthorized
        '404':
          description: Diet plan not found
components: {}
